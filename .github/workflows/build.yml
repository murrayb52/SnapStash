name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^snapstash.version=//p' gradle.properties)
          echo "name=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Unit tests, release APK and debug APK
        env:
          SNAPSTASH_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease assembleDebug -Proborazzi.test.record=true
      - name: Name the APKs
        run: |
          mv app/build/outputs/apk/release/app-release.apk "snapstash-${{ steps.version.outputs.name }}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "snapstash-${{ steps.version.outputs.name }}-debug.apk"
      # The one to install: optimised, so startup is much faster. Same signing key as debug.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: snapstash-${{ steps.version.outputs.name }}
          path: snapstash-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snapstash-${{ steps.version.outputs.name }}-debug
          path: snapstash-${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: snapstash-${{ steps.version.outputs.name }}-screenshots
          path: app/build/screenshots/
          if-no-files-found: warn
      - name: Publish screenshots to the ci-screenshots branch
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          out=$(mktemp -d)
          cp app/build/screenshots/*.png "$out"/
          cd "$out"
          {
            echo "# SnapStash $VERSION screenshots"
            echo
            echo "Rendered by CI from \`${SHA:0:7}\`. This branch is overwritten on every build of main."
            echo
            for f in *.png; do echo "<img src=\"$f\" width=\"300\" alt=\"$f\">"; done
          } > README.md
          git init -q -b ci-screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots for $VERSION (${SHA:0:7})"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$REPO.git" ci-screenshots
      - name: Upload test and build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
