name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^snapstash.version=//p' gradle.properties)
          echo "name=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Unit tests and debug APK
        env:
          SNAPSTASH_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "snapstash-${{ steps.version.outputs.name }}-debug.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snapstash-${{ steps.version.outputs.name }}-debug
          path: snapstash-${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error
      - name: Upload test and build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
